name: Prueba ejecucion de script de python
run-name: ${{ github.actor }} esta probando la ejecucion de un script de python
on: [push]

jobs:
    ejecuta-python:
        runs-on: ubuntu-latest
        steps:
            - run: echo "inicia actions"
            - run: python --version
            - name: Check out repository code
              uses: actions/checkout@v6
            - run: ls -al
            - run: python app.py